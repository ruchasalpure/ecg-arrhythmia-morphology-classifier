spec_version: "0.1.0"
name: "ecg-arrhythmia-morphology-classifier"
version: "1.0.0"
category: "healthcare"
author: "Rucha Salpure"
description: "Delineates P-Q-R-S-T fiducial points across 12-lead electrocardiograms to classify atrial fibrillation, ventricular tachycardias, and prolonged QTc intervals"
capabilities:
  - "ecg-fiducial-wave-delineation"
  - "autonomous-decision-making"
  - "explainable-auditing"
  - "multi-agent-collaboration"
skills:
  - "ecg-fiducial-wave-delineation"
tools:
  - "python_executor"
  - "audit_logger"
  - "schema_validator"
runtime:
  environment: "python3.11"
  memory_limit: "4GB"
  timeout_seconds: 300
governance:
  audit_logging: true
  human_in_the_loop: false
  maker_checker: true
  explainability_required: true
